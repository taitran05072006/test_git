apiVersion: v1
kind: ConfigMap
metadata:
  name: product-api-config
  namespace: {{ .Values.namespace }}
data:
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  JPA_DDL_AUTO: {{ .Values.database.ddlAuto | quote }}
