apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api-frontend
  namespace: {{ .Values.namespace }}
  labels: {{- include "product-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.frontend }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: product-api-frontend}}
  template:
    metadata: {labels: {app: product-api-frontend}}
    spec:
      serviceAccountName: product-api
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ required "images.frontend.tag must be set to an immutable build tag" .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports: [{name: http, containerPort: 8080}]
          resources: {{- toYaml .Values.resources.frontend | nindent 12 }}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
spec:
  selector: {app: product-api-frontend}
  ports: [{name: http, port: 80, targetPort: http}]
