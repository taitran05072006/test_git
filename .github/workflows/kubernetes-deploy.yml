name: Kubernetes deploy

on:
  workflow_run:
    workflows: ["Java CI Docker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Helm values file to use
        required: true
        default: dev
        type: choice
        options: [dev, staging, production]
      image_tag:
        description: Immutable image tag (usually a commit SHA)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/setup-helm@v4
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SERVER_HOST }}
          log-mode: normal
      - name: Deploy with Helm on server
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_ENV: ${{ inputs.environment || 'dev' }}
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_ENV,IMAGE_REGISTRY,IMAGE_TAG,REPOSITORY,GITHUB_TOKEN
          script: |
            set -e
            [ -n "$IMAGE_REGISTRY" ] || { echo "IMAGE_REGISTRY is empty"; exit 1; }
            [ -n "$IMAGE_TAG" ] || { echo "IMAGE_TAG is empty"; exit 1; }
            [ -n "$REPOSITORY" ] || { echo "REPOSITORY is empty"; exit 1; }
            [ -n "$GITHUB_TOKEN" ] || { echo "GITHUB_TOKEN is empty"; exit 1; }
            command -v helm || { echo "helm is not installed or not in PATH for $(id -un)"; exit 1; }
            command -v kubectl || { echo "kubectl is not installed or not in PATH"; exit 1; }
            command -v curl || { echo "curl is not installed or not in PATH"; exit 1; }
            command -v tar || { echo "tar is not installed or not in PATH"; exit 1; }
            export KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}"
            [ -r "$KUBECONFIG" ] || { echo "Kubeconfig is not readable: $KUBECONFIG"; exit 1; }
            kubectl get nodes

            WORKDIR="$(mktemp -d)"
            trap 'rm -rf "$WORKDIR"' EXIT
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/tarball/$IMAGE_TAG" \
              --output "$WORKDIR/source.tar.gz"
            mkdir "$WORKDIR/source"
            tar -xzf "$WORKDIR/source.tar.gz" --strip-components=1 -C "$WORKDIR/source"

            helm upgrade --install product-api \
              "$WORKDIR/source/deploy/helm/product-api" \
              --namespace product \
              --create-namespace \
              --values "$WORKDIR/repository/deploy/helm/product-api/values-$DEPLOY_ENV.yaml" \
              --set images.backend.repository="$IMAGE_REGISTRY/product-api" \
              --set images.backend.tag="$IMAGE_TAG" \
              --set images.frontend.repository="$IMAGE_REGISTRY/product-frontend" \
              --set images.frontend.tag="$IMAGE_TAG" \
              --atomic \
              --wait \
              --timeout 10m
