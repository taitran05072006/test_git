services:
  backend:
    build: .
    container_name: demo-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: demo
      DB_USER: root
      DB_PASSWORD: root123

  mysql:
    image: mysql:8.0
    container_name: demo-sql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: demo
    volumes:
      - mysql-data:/var/lib/mysql

  nginx:
    image: nginx:stable
    container_name: demo-nginx
    ports:
      - "8085:80"
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mysql-data: