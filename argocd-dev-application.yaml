apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-api-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/taitran05072006/test_git.git
    targetRevision: main
    path: deploy/helm/product-api
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: product

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
