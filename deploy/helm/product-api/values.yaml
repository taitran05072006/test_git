namespace: product
images:
  backend:
    repository: taitran05072006/product-api
    tag: ""
    pullPolicy: IfNotPresent
  frontend:
    repository: taitran05072006/product-frontend
    tag: ""
    pullPolicy: IfNotPresent
imagePullSecrets: []
replicas:
  backend: 2
  frontend: 2
database:
  inCluster: false
  host: ""
  port: 3306
  name: productdb
  user: product
  ddlAuto: validate
  existingSecret: product-api-database
  passwordKey: password
ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: product-api-tls
resources:
  backend:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  frontend:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
backend:
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
    maxUnavailable: null
frontend:
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
    maxUnavailable: null
mysql:
  image: mysql:8.0
  storage:
    size: 1Gi
networkPolicy:
  enabled: true
  dnsNamespace: ""
  dnsPodSelector: {}
  ingressControllerNamespace: ""
  ingressControllerPodSelector: {}
  externalDatabaseCIDR: ""
