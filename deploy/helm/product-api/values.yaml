namespace: product
images:
  backend:
    repository: taitran05072006/backend
    # Immutable build tag; keep in sync with values-dev.yaml until CI updates it.
    tag: 9f55ade2efa37559434c439514841532f1fc7dd8
    pullPolicy: IfNotPresent
  frontend:
    repository: taitran05072006/frontend
    tag: 9f55ade2efa37559434c439514841532f1fc7dd8
    pullPolicy: IfNotPresent
imagePullSecrets: []
replicas:
  backend: 2
  frontend: 2
database:
  inCluster: true
  host: mysql
  port: 3306
  name: productdb
  user: product
  ddlAuto: validate
  existingSecret: product-api-database
  passwordKey: password
  # Keep credentials in a separately managed Kubernetes Secret by default.
  createSecret: false
  # Set only through a secure deployment input when createSecret is true.
  password: ""
  rootPassword: ""
ingress:
  enabled: true
  className: nginx
  host: product.local
  hosts:
    - product.local
    - localhost
  annotations: {}
  tls:
    enabled: false
    secretName: product-api-tls
resources:
  backend:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  frontend:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
backend:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
    maxUnavailable: null
frontend:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
    maxUnavailable: null
mysql:
  image: mysql:8.0
  storage:
    size: 1Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: 1, memory: 1Gi}
networkPolicy:
  enabled: true
  dnsNamespace: kube-system
  dnsPodSelector:
    k8s-app: kube-dns
  ingressControllerNamespace: nginx-ingress
  ingressControllerPodSelector:
    app.kubernetes.io/name: nginx-ingress
    app.kubernetes.io/instance: nginx-ingress
  externalDatabaseCIDR: ""
