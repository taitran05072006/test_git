name: Java CI Docker

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: productdb
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
          MYSQL_ROOT_PASSWORD: root_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: productdb
      DB_USER: ci_user
      DB_PASSWORD: ci_password

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Lay source code
        uses: actions/checkout@v6

      # =========================
      # JAVA
      # =========================
      - name: Cai Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # =========================
      # TEST BACKEND
      # =========================
      - name: Build va Test Backend
        working-directory: ./product-api
        run: ./mvnw -B test

      # =========================
      # DOCKER HUB LOGIN
      # =========================
      - name: Dang nhap Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================
      # BUILDX
      # =========================
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # =========================
      # BUILD BACKEND
      # =========================
      - name: Build and Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./product-api
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/java-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/java-backend:${{ github.sha }}

      # =========================
      # BUILD FRONTEND
      # =========================
      - name: Build and Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./front
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/java-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/java-frontend:${{ github.sha }}

  # =========================================
  # DEPLOY
  # =========================================
  deploy:
    needs: build-test-push
    runs-on: ubuntu-latest

    steps:
      # =========================
      # TAILSCALE
      # =========================
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SERVER_HOST }}
          log-mode: normal

      # =========================
      # DEPLOY UBUNTU
      # =========================
      - name: Deploy Application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            cd /home/deploy/java-deploy

            NEW_TAG="${{ github.sha }}"

            echo "================================"
            echo "Deploy version: $NEW_TAG"
            echo "================================"

            # Pull đúng backend + frontend của commit hiện tại
            IMAGE_TAG="$NEW_TAG" docker compose pull backend frontend

            # Deploy backend + frontend mới
            IMAGE_TAG="$NEW_TAG" docker compose up -d \
              --no-deps \
              --force-recreate \
              backend frontend

            # Recreate nginx
            IMAGE_TAG="$NEW_TAG" docker compose up -d \
              --force-recreate nginx

            echo "================================"
            echo "Container status"
            echo "================================"

            docker compose ps

            echo "================================"
            echo "Waiting for application"
            echo "================================"

            for i in {1..12}; do

              if curl \
                --fail \
                --silent \
                --show-error \
                http://127.0.0.1:8085/api/hello; then

                echo ""
                echo "================================"
                echo "Deploy successful"
                echo "Version: $NEW_TAG"
                echo "================================"

                docker compose ps

                exit 0
              fi

              echo "Application not ready - attempt $i/12"

              sleep 5
            done

            echo "================================"
            echo "Deploy failed"
            echo "================================"

            echo ""
            echo "----- BACKEND LOG -----"
            docker compose logs backend --tail 100 || true

            echo ""
            echo "----- FRONTEND LOG -----"
            docker compose logs frontend --tail 100 || true

            echo ""
            echo "----- NGINX LOG -----"
            docker compose logs nginx --tail 100 || true

            echo ""
            echo "----- MYSQL LOG -----"
            docker compose logs mysql --tail 100 || true

            exit 1