{{- $root := . -}}
{{- range $component := list "backend" "frontend" }}
{{- $config := index $root.Values $component }}
{{- if $config.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "product-api.fullname" $root }}-{{ $component }}
  namespace: {{ $root.Values.namespace }}
  labels:
    app: {{ include "product-api.fullname" $root }}-{{ $component }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "product-api.fullname" $root }}-{{ $component }}
  minReplicas: {{ $config.hpa.minReplicas }}
  maxReplicas: {{ $config.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $config.hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $config.hpa.targetMemoryUtilizationPercentage }}
{{- end }}
{{- end }}
