name: Java CI Docker

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: productdb
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
          MYSQL_ROOT_PASSWORD: root_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: productdb
      DB_USER: ci_user
      DB_PASSWORD: ci_password

    steps:
      - name: Lay source code
        uses: actions/checkout@v6

      - name: Cai Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build va Test Backend
        working-directory: ./product-api
        run: ./mvnw -B test

      - name: Dang nhap Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./product-api
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/java-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/java-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}
          cache-from: type=gha,scope=product-api
          cache-to: type=gha,mode=max,scope=product-api

      - name: Build and Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./front
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/java-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/java-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/product-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-frontend:${{ github.sha }}
          cache-from: type=gha,scope=product-frontend
          cache-to: type=gha,mode=max,scope=product-frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/product-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL

  deploy:
    needs: build-test-push
    runs-on: ubuntu-latest

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SERVER_HOST }}
          log-mode: normal

      - name: Deploy Application
        uses: appleboy/ssh-action@v1
        env:
          NEW_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: NEW_TAG
          script: |
            set -e
            cd /home/deploy/java-deploy

            IMAGE_TAG="$NEW_TAG" docker compose pull backend frontend nginx
            IMAGE_TAG="$NEW_TAG" docker compose up -d --no-deps --force-recreate backend frontend nginx

            docker compose ps

            docker compose logs backend --tail 30 || true

            i=1
            while [ "$i" -le 24 ]; do
              if curl --fail --silent --show-error \
                http://127.0.0.1:8085/api/hello; then
                echo "Docker Compose deploy successful: $NEW_TAG"
                exit 0
              fi
              echo "Application not ready - attempt $i/24"
              sleep 5
              i=$((i + 1))
            done

            docker compose logs backend --tail 100 || true
            docker compose logs frontend --tail 100 || true
            docker compose logs nginx --tail 100 || true
            docker compose logs mysql --tail 100 || true
            exit 1
