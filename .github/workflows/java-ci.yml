name: Java CI Docker

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: productdb
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: productdb
      DB_USER: ci_user
      DB_PASSWORD: ci_password

    steps:
      - name: Lay source code
        uses: actions/checkout@v6

      - name: Cai Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cho phep mvnw chay
        run: chmod +x mvnw

      - name: Build va Test
        run: ./mvnw -B test

      - name: Dang nhap Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
              ${{ secrets.DOCKERHUB_USERNAME }}/java-backend:latest
              ${{ secrets.DOCKERHUB_USERNAME }}/java-backend:${{ github.sha }}

  deploy:
    needs: build-test-push
    runs-on: ubuntu-latest

    steps:
    - name: Connect Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:ci
        ping: ${{ secrets.SERVER_HOST }}
        log-mode: normal

    - name: Deploy backend
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}

        script: |
          cd /home/deploy/java-deploy

          NEW_TAG="${{ github.sha }}"
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/java-backend"

          echo "New version: $NEW_TAG"

          # Lấy image backend đang chạy và giữ lại làm bản rollback
          CURRENT_IMAGE_ID=$(docker inspect demo-backend \
          --format='{{.Image}}' 2>/dev/null || true)

          echo "Current image ID: $CURRENT_IMAGE_ID"

          if [ -n "$CURRENT_IMAGE_ID" ]; then
          docker tag "$CURRENT_IMAGE_ID" "$IMAGE_NAME:rollback"
          echo "Saved current version as rollback"
          fi

          # Pull đúng image của commit hiện tại
          IMAGE_TAG="$NEW_TAG" docker compose pull backend

          # Deploy backend mới
          IMAGE_TAG="$NEW_TAG" docker compose up -d \
          --no-deps --force-recreate backend

          # Kiểm tra tối đa khoảng 60 giây
          for i in {1..12}; do
          if curl --fail http://127.0.0.1:8085/api/hello; then
          echo "Deploy successful: $NEW_TAG"
          exit 0
          fi

          echo "Waiting for backend... attempt $i/12"
          sleep 5
          done

          echo "New version failed"
          docker logs demo-backend --tail 100

          # Rollback
          if docker image inspect "$IMAGE_NAME:rollback" >/dev/null 2>&1; then
          echo "Rolling back..."

          IMAGE_TAG=rollback docker compose up -d \
          --no-deps --force-recreate backend

          echo "Waiting for rollback... "
          sleep 10

          if curl --fail http://127.0.0.1:8085/api/hello; then
          echo "Rollback successful"
          else
          echo "Rollback also failed"
          fi
          fi

          exit 1