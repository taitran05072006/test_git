name: Kubernetes GitOps CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "deploy/helm/**"

permissions:
  contents: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: productdb
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
          MYSQL_ROOT_PASSWORD: root_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: productdb
      DB_USER: ci_user
      DB_PASSWORD: ci_password

    steps:
      - name: Lay source code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Cai Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build va Test Backend
        working-directory: ./product-api
        run: ./mvnw -B test

      - name: Dang nhap Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./product-api
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/java-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/java-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}
          cache-from: type=gha,scope=product-api
          cache-to: type=gha,mode=max,scope=product-api

      - name: Build and Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./front
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/java-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/java-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/product-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-frontend:${{ github.sha }}
          cache-from: type=gha,scope=product-frontend
          cache-to: type=gha,mode=max,scope=product-frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/product-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL

      - name: Update Helm image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          values = Path("deploy/helm/product-api/values-dev.yaml")
          text = values.read_text()
          username = os.environ.get("DOCKERHUB_USERNAME", "").strip()
          if not username:
              raise SystemExit("DOCKERHUB_USERNAME must be configured")
          for component, image in (("backend", "product-api"), ("frontend", "product-frontend")):
              text, count = re.subn(
                  rf'(?m)^(  {component}: \{{repository: )[^,]+',
                  rf'\g<1>{username}/{image}',
                  text,
              )
              if count != 1:
                  raise SystemExit(f"Expected one {component} image repository, updated {count}")
          updated, count = re.subn(
              r'(?m)^(  (?:backend|frontend): \{repository: [^,]+, tag: )[^,}]+(, pullPolicy: [^}]+\})$',
              lambda match: f"{match.group(1)}{os.environ['IMAGE_TAG']}{match.group(2)}",
              text,
          )
          if count != 2:
              raise SystemExit(f"Expected to update 2 image tags, updated {count}")
          values.write_text(updated)
          PY

      - name: Commit and push Helm image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/product-api/values-dev.yaml
          if git diff --cached --quiet; then
            echo "Helm values already use image tag $IMAGE_TAG"
            exit 0
          fi
          git commit -m "chore(deploy): update dev image tag to ${IMAGE_TAG}"
          git push origin HEAD:main

