apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api-backend
  namespace: {{ .Values.namespace }}
  labels: {{- include "product-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.backend }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: product-api-backend}}
  template:
    metadata: {labels: {app: product-api-backend}}
    spec:
      serviceAccountName: product-api
      imagePullSecrets: {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: wait-for-database
          image: busybox:1.36
          securityContext: {runAsUser: 65534, runAsGroup: 65534, runAsNonRoot: true}
          command: ["sh", "-c", "until nc -z {{ .Values.database.host }} {{ .Values.database.port }}; do echo waiting for database; sleep 2; done"]
      containers:
        - name: backend
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: product-api-config}}]
          env:
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: {{ .Values.database.passwordKey }}}}
          resources: {{- toYaml .Values.resources.backend | nindent 12 }}
          startupProbe: {httpGet: {path: /actuator/health, port: http}, failureThreshold: 30, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
spec:
  selector: {app: product-api-backend}
  ports: [{name: http, port: 8080, targetPort: http}]
