name: Kubernetes deploy

on:
  workflow_run:
    workflows: ["Java CI Docker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Helm values file to use
        required: true
        default: dev
        type: choice
        options: [dev, staging, production]
      image_tag:
        description: Immutable image tag (usually a commit SHA)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/setup-helm@v4
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SERVER_HOST }}
          log-mode: normal
      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          KUBE_API_SERVER: ${{ secrets.KUBE_API_SERVER }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "::error::KUBECONFIG_B64 is missing. Add it to the '${{ inputs.environment || 'dev' }}' environment or repository secrets."
            exit 1
          fi
          if [ -z "$KUBE_API_SERVER" ]; then
            echo "::error::KUBE_API_SERVER is missing. Set it to the reachable Kubernetes API URL, for example https://100.x.x.x:6443."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          awk -v server="$KUBE_API_SERVER" \
            '/^[[:space:]]*server:/ {$0 = "    server: " server} {print}' \
            "$HOME/.kube/config" > "$HOME/.kube/config.tmp"
          mv "$HOME/.kube/config.tmp" "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          if grep -q '0\.0\.0\.0\|127\.0\.0\.1\|localhost' "$HOME/.kube/config"; then
            echo "::error::Kubeconfig still contains a loopback Kubernetes API endpoint."
            exit 1
          fi
      - name: Deploy with Helm
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
        run: |
          if [ -z "$IMAGE_REGISTRY" ]; then
            echo "::error::IMAGE_REGISTRY is missing. Add it as a variable to the '${{ inputs.environment || 'dev' }}' environment or repository variables."
            exit 1
          fi
          helm upgrade --install product-api deploy/helm/product-api \
            --namespace product --create-namespace \
            --values "deploy/helm/product-api/values-${{ inputs.environment || 'dev' }}.yaml" \
            --set images.backend.repository="$IMAGE_REGISTRY/product-api" \
            --set images.backend.tag="$IMAGE_TAG" \
            --set images.frontend.repository="$IMAGE_REGISTRY/product-frontend" \
            --set images.frontend.tag="$IMAGE_TAG" \
            --rollback-on-failure --wait --timeout 10m
