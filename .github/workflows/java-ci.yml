name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-java:
    runs-on: ubuntu-latest

    steps:
      - name: Lay source code
        uses: actions/checkout@v6

      - name: Cai java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Kiem tra Java
        run: java -version

      - name: Chay test
        run: mvn -B -f test_git/pom.xml test