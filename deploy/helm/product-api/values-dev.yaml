images:
  backend: {repository: taitran05072006/product-api, tag: dev, pullPolicy: IfNotPresent}
  frontend: {repository: taitran05072006/product-frontend, tag: dev, pullPolicy: IfNotPresent}
replicas: {backend: 2, frontend: 2}
database:
  inCluster: true
  host: mysql
  port: 3306
  name: demo
  user: product
  existingSecret: product-api-database
  ddlAuto: update
mysql:
  storage:
    size: 1Gi
ingress:
  enabled: true
  className: traefik
  host: product.local
  hosts:
    - product.local
    - localhost
networkPolicy:
  dnsNamespace: kube-system
  dnsPodSelector:
    k8s-app: kube-dns
  ingressControllerNamespace: kube-system
  ingressControllerPodSelector:
    app.kubernetes.io/name: traefik
backend:
  pdb: {enabled: false}
frontend:
  pdb: {enabled: false}
