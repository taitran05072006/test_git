{{- if .Values.database.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.existingSecret }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "product-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.database.user | quote }}
  password: {{ required "database.password is required when database.createSecret=true" .Values.database.password | quote }}
  root-password: {{ required "database.rootPassword is required when database.createSecret=true" .Values.database.rootPassword | quote }}
{{- end }}
