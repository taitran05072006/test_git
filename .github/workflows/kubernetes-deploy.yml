name: Kubernetes deploy

on:
  workflow_run:
    workflows: ["Java CI Docker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Helm values file to use
        required: true
        default: dev
        type: choice
        options: [dev, staging, production]
      image_tag:
        description: Immutable image tag (usually a commit SHA)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/setup-helm@v4
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SERVER_HOST }}
          log-mode: normal
      - name: Deploy with Helm on server
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_ENV: ${{ inputs.environment || 'dev' }}
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_ENV,IMAGE_REGISTRY,IMAGE_TAG,REPOSITORY
          script: |
            set -e
            test -n "$IMAGE_REGISTRY"
            test -n "$IMAGE_TAG"
            test -n "$REPOSITORY"
            command -v helm >/dev/null
            command -v git >/dev/null

            WORKDIR="$(mktemp -d)"
            trap 'rm -rf "$WORKDIR"' EXIT
            git clone --quiet "https://github.com/$REPOSITORY.git" "$WORKDIR/repository"
            git -C "$WORKDIR/repository" fetch --quiet --depth 1 origin "$IMAGE_TAG"
            git -C "$WORKDIR/repository" checkout --quiet "$IMAGE_TAG"

            helm upgrade --install product-api \
              "$WORKDIR/repository/deploy/helm/product-api" \
              --namespace product \
              --create-namespace \
              --values "$WORKDIR/repository/deploy/helm/product-api/values-$DEPLOY_ENV.yaml" \
              --set images.backend.repository="$IMAGE_REGISTRY/product-api" \
              --set images.backend.tag="$IMAGE_TAG" \
              --set images.frontend.repository="$IMAGE_REGISTRY/product-frontend" \
              --set images.frontend.tag="$IMAGE_TAG" \
              --rollback-on-failure \
              --wait \
              --timeout 10m
